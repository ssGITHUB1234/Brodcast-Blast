<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 50px 40px;
            border-radius: 15px;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        h2 {
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .timer {
            font-size: 64px;
            font-weight: bold;
            margin: 30px 0;
            color: #4CAF50;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }
        
        .status {
            font-size: 16px;
            color: #ccc;
            margin: 20px 0;
            min-height: 50px;
            line-height: 1.5;
        }
        
        .hidden {
            display: none !important;
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 Watching Advertisement</h2>
        <div class="timer" id="timer">00:30</div>
        <div class="status" id="status">⏳ Ad playing... please wait...</div>
        
        <div id="error"></div>
    </div>

    <!-- Monetag SDK - Zone 10243712 -->
    <script src='//libtl.com/sdk.js' data-zone='10243712' data-sdk='show_10243712'></script>

    <script>
        const USER_ID = new URLSearchParams(window.location.search).get('user_id');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        
        let timerInterval = null;
        let timeRemaining = 30;
        let adCompleted = false;
        
        function startTimer() {
            timeRemaining = 30;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    completeAdWatch();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        
        function showMonetgAd() {
            setTimeout(() => {
                if (typeof show_10243712 === 'function') {
                    console.log('Monetag SDK loaded, showing Rewarded Interstitial...');
                    
                    show_10243712({
                        ymid: USER_ID
                    }).then(() => {
                        console.log('Monetag ad completed');
                        if (timeRemaining > 0) {
                            timeRemaining = 0;
                            completeAdWatch();
                        }
                    }).catch((error) => {
                        console.log('Monetag ad error or unavailable:', error);
                    });
                } else {
                    console.log('Monetag SDK not available, using timer only');
                    statusEl.textContent = '⏳ Watching advertisement...';
                }
            }, 300);
        }
        
        function completeAdWatch() {
            if (adCompleted) return;
            adCompleted = true;
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            timerEl.textContent = '✅';
            statusEl.textContent = '✅ Ad complete! Returning...';
            
            if (USER_ID) {
                fetch(`/api/ads/watched/${USER_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json()).then(() => {
                    returnToTelegram();
                }).catch(e => {
                    console.error('Error notifying backend:', e);
                    returnToTelegram();
                });
            } else {
                returnToTelegram();
            }
        }
        
        function returnToTelegram() {
            setTimeout(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData(JSON.stringify({
                        action: 'ad_complete',
                        user_id: USER_ID
                    }));
                    window.Telegram.WebApp.close();
                } else {
                    window.history.back();
                }
            }, 500);
        }
        
        window.addEventListener('load', () => {
            console.log('Ad viewer loaded - auto-starting ad');
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            
            if (USER_ID) {
                fetch(`/api/ads/started/${USER_ID}`, { method: 'POST' })
                    .catch(e => console.error('Error tracking ad start:', e));
            }
            
            startTimer();
            showMonetgAd();
        });
    </script>
</body>
</html>
