<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad</title>
    <script src='//libtl.com/sdk.js' data-zone='10243712' data-sdk='show_10243712'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
        }
        
        .timer {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #4CAF50;
        }
        
        .status {
            font-size: 18px;
            margin: 20px 0;
            min-height: 60px;
        }
        
        button {
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #888;
            cursor: not-allowed;
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 Watch Ad</h2>
        <div class="timer" id="timer">Loading...</div>
        <div class="status" id="status">Preparing ad...</div>
        <button id="showAdBtn" onclick="showAd()">▶️ Show Ad</button>
        <button id="continueBtn" style="display: none;" onclick="continueToBroadcast()">✅ Ad Complete - Continue</button>
        <div id="error"></div>
    </div>

    <script>
        const USER_ID = new URLSearchParams(window.location.search).get('user_id');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const showAdBtn = document.getElementById('showAdBtn');
        const continueBtn = document.getElementById('continueBtn');
        const errorEl = document.getElementById('error');
        
        let timerInterval = null;
        let timeRemaining = 0;
        let adShown = false;
        let adCompleted = false;
        
        // Wait for Monetag SDK to load
        function waitForSdk() {
            return new Promise((resolve) => {
                if (typeof show_10243712 !== 'undefined') {
                    resolve();
                } else {
                    const checkInterval = setInterval(() => {
                        if (typeof show_10243712 !== 'undefined') {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        resolve(); // Continue anyway after 5 seconds
                    }, 5000);
                }
            });
        }
        
        // Show the ad using Monetag SDK
        async function showAd() {
            if (adShown) return;
            adShown = true;
            
            showAdBtn.disabled = true;
            statusEl.textContent = '⏱️ Ad playing... (30 seconds)';
            
            try {
                // Wait for SDK
                await waitForSdk();
                
                // Start timer
                startTimer();
                
                // Call Monetag SDK to show ad
                if (typeof show_10243712 !== 'undefined') {
                    show_10243712().then(() => {
                        // Ad completed!
                        onAdComplete();
                    }).catch((error) => {
                        console.error('Ad error:', error);
                        // Still allow user to continue after timer
                        statusEl.textContent = '⚠️ Ad issue - please wait';
                    });
                } else {
                    // SDK not available, just use timer
                    console.log('Monetag SDK not loaded, using timer fallback');
                    startTimer();
                }
            } catch (error) {
                console.error('Error showing ad:', error);
                errorEl.innerHTML = '<div class="error">Error showing ad. Using timer instead...</div>';
                startTimer();
            }
        }
        
        function startTimer() {
            timeRemaining = 30;
            updateTimer();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimer();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    onAdComplete();
                }
            }, 1000);
        }
        
        function updateTimer() {
            timerEl.textContent = `${String(Math.floor(timeRemaining / 60)).padStart(2, '0')}:${String(timeRemaining % 60).padStart(2, '0')}`;
        }
        
        function onAdComplete() {
            if (adCompleted) return;
            adCompleted = true;
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerEl.textContent = '✅ Complete!';
            statusEl.textContent = 'Ad watched successfully!';
            showAdBtn.style.display = 'none';
            continueBtn.style.display = 'block';
            
            // Notify backend
            if (USER_ID) {
                fetch(`/api/ads/watched/${USER_ID}`, { method: 'POST' })
                    .then(r => r.json())
                    .catch(e => console.error('Error:', e));
            }
        }
        
        function continueToBroadcast() {
            // Close the window/redirect back
            if (window.opener) {
                window.close();
            } else if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'ad_complete' }, '*');
            } else {
                // Fallback - just go back
                window.history.back();
            }
        }
        
        // Start when page loads
        window.addEventListener('load', () => {
            timerEl.textContent = '00:30';
            statusEl.textContent = 'Click button to start watching ad';
            showAdBtn.style.display = 'block';
        });
    </script>
</body>
</html>
