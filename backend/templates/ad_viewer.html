<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 50px 40px;
            border-radius: 15px;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        h2 {
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .timer {
            font-size: 64px;
            font-weight: bold;
            margin: 30px 0;
            color: #4CAF50;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }
        
        .status {
            font-size: 16px;
            color: #ccc;
            margin: 20px 0;
            min-height: 50px;
            line-height: 1.5;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
            margin-top: 30px;
        }
        
        button {
            padding: 14px 32px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        button:disabled {
            background: #888;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .hidden {
            display: none !important;
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 Watch Advertisement</h2>
        <div class="timer" id="timer">00:30</div>
        <div class="status" id="status">Ready to watch ad</div>
        
        <div class="button-group">
            <button id="startBtn" onclick="startAdWatching()">▶️ Start Watching</button>
            <button id="completeBtn" class="hidden" onclick="completeAd()">✅ Ad Watched - Continue</button>
        </div>
        
        <div id="error"></div>
    </div>

    <!-- Monetag SDK - Zone 10243712 -->
    <script src='//libtl.com/sdk.js' data-zone='10243712' data-sdk='show_10243712'></script>

    <script>
        const USER_ID = new URLSearchParams(window.location.search).get('user_id');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const completeBtn = document.getElementById('completeBtn');
        const errorEl = document.getElementById('error');
        
        let timerInterval = null;
        let timeRemaining = 30;
        let adStarted = false;
        let adCompleted = false;
        
        function startAdWatching() {
            if (adStarted) return;
            adStarted = true;
            startBtn.disabled = true;
            
            statusEl.textContent = '⏳ Ad playing... watching time...';
            
            // Track that user started watching ad
            if (USER_ID) {
                fetch(`/api/ads/started/${USER_ID}`, { method: 'POST' })
                    .catch(e => console.error('Error tracking ad start:', e));
            }
            
            // Start 30-second timer
            startTimer();
            
            // Try to show Monetag Rewarded Interstitial
            showMonetgAd();
        }
        
        function startTimer() {
            timeRemaining = 30;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    completeAdWatch();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        
        function showMonetgAd() {
            // Wait for SDK to load
            setTimeout(() => {
                if (typeof show_10243712 === 'function') {
                    console.log('Monetag SDK loaded, showing Rewarded Interstitial...');
                    
                    // Call Rewarded Interstitial - SDK returns Promise
                    show_10243712({
                        ymid: USER_ID  // Pass user ID for tracking
                    }).then(() => {
                        console.log('Monetag ad completed');
                        if (timeRemaining > 0) {
                            timeRemaining = 0;  // Force timer to complete
                            completeAdWatch();
                        }
                    }).catch((error) => {
                        console.log('Monetag ad error or unavailable:', error);
                        // Continue with timer - user still watching
                    });
                } else {
                    console.log('Monetag SDK not available, using timer only');
                    statusEl.textContent = '⏳ Watching advertisement... (timer-based)';
                }
            }, 500);
        }
        
        function completeAdWatch() {
            if (adCompleted) return;
            adCompleted = true;
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // Update UI
            timerEl.textContent = '✅ Complete!';
            statusEl.textContent = '✅ Ad watched successfully!';
            startBtn.classList.add('hidden');
            completeBtn.classList.remove('hidden');
            
            // Notify backend that user watched ad
            if (USER_ID) {
                fetch(`/api/ads/watched/${USER_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).then(r => r.json()).catch(e => {
                    console.error('Error notifying backend:', e);
                });
            }
        }
        
        function completeAd() {
            // Return to Telegram or close window
            if (window.tg && window.tg.close) {
                // Telegram Mini App context
                window.tg.close();
            } else if (window.opener) {
                // Opened as popup
                window.close();
            } else {
                // Fallback - go back
                window.history.back();
            }
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            console.log('Ad viewer loaded, waiting for user to start');
        });
    </script>
</body>
</html>
