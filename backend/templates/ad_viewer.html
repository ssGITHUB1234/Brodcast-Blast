<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .ad-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }
        
        .timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            min-width: 100px;
            text-align: center;
        }
        
        .ad-frame {
            width: 100%;
            aspect-ratio: 9/16;
            border: none;
            border-radius: 10px;
            background: #111;
        }
        
        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }
        
        .completed {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }
        
        .completed.show {
            display: block;
        }
        
        .completed h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .completed p {
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="timer" id="timer">00:30</div>
        <iframe id="adFrame" class="ad-frame"></iframe>
        <div class="message">Watch the ad to continue</div>
    </div>
    
    <div class="completed" id="completed">
        <h2>✅ Ad Watched!</h2>
        <p>Broadcast creation starting...</p>
    </div>

    <script>
        const USER_ID = new URLSearchParams(window.location.search).get('user_id');
        const AD_LINK = new URLSearchParams(window.location.search).get('link');
        const timerEl = document.getElementById('timer');
        const adFrame = document.getElementById('adFrame');
        const completedEl = document.getElementById('completed');
        
        let timeRemaining = 30; // 30 seconds default
        
        // Load ad link in iframe
        if (AD_LINK) {
            adFrame.src = AD_LINK;
        }
        
        // Start timer
        const timerInterval = setInterval(() => {
            timeRemaining--;
            
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                onAdComplete();
            }
        }, 1000);
        
        function onAdComplete() {
            // Show completed message
            completedEl.classList.add('show');
            adFrame.style.opacity = '0.5';
            
            // Notify backend that ad was watched
            if (USER_ID) {
                fetch(`/api/ads/watched/${USER_ID}`, { method: 'POST' })
                    .then(r => r.json())
                    .catch(e => console.error('Ad completion error:', e));
            }
            
            // Close after 2 seconds (user will return to Telegram)
            setTimeout(() => {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
